bot_name: "Dexter"
wake_words:
  - "hey"
  - "hey dexter"

wake_behavior:
  active_seconds: 30
  match_mode: "prefix"    # prefix or any
  min_confidence: 0.86
  max_prefix_tokens: 4

activation:
  mode: "wake_word"  # options: "wake_word" or "clap"
  clap_sensitivity: 3.0
  active_window_seconds: 30
  start_active: true
  min_command_words: 2
  wake_words:
    - "hey"
    - "hey dexter"

api_keys:
  gemini: ""               # Set GEMINI_API_KEY in .env or environment
  groq: ""                 # Set GROQ_API_KEY in .env or environment

models:
  primary_llm: "gemini-2.0-flash"              # Gemini — fast primary brain
  fallback_llm: "llama-3.3-70b-versatile"      # Groq — lightning fast fallback
  local_llm: "qwen3-coder:480b-cloud"           # Ollama — offline local fallback
  whisper_model: "small.en"                    # Speech-to-text (runs on RTX GPU)
  tts_voice: "en-GB-RyanNeural"                # Professional British Male Voice (Edge-TTS, free)

defaults:
  city: "Kathmandu"

security:
  require_confirm_power_actions: true
  allowed_apps: []
  allowed_file_roots:
    - "%USERPROFILE%/Documents"
    - "%USERPROFILE%/Desktop"
    - "."
  tool_timeout_sec: 10

rag:
  intent_catalog_path: "intent_catalog.md"
  intent_top_k: 3
  intent_min_score: 0.72

audio_settings:
  sample_rate: 16000
  chunk_size: 512

stt:
  beam_size: 3
  best_of: 5
  temperature: 0.0
  patience: 1.0
  log_prob_threshold: -1.0
  no_speech_threshold: 0.6
  condition_on_previous_text: false
  initial_prompt: "Common Windows assistant commands and app names: open, close, start, launch, take screenshot, screen capture, set volume, clipboard, Chrome, Google Chrome, Edge, Microsoft Edge, Firefox, Spotify, Discord, Notepad, Calculator, Settings, File Explorer, Visual Studio Code, VS Code."

history:
  max_tokens: 1800

mcp:
  enabled: false
