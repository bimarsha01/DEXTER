bot_name: "Dexter"
wake_words:
  - "hey"
  - "hey dexter"

wake_behavior:
  active_seconds: 30
  match_mode: "prefix"    # prefix or any
  min_confidence: 0.86
  max_prefix_tokens: 4

activation:
  mode: "smart"             # smart | wake_word | always_on | clap
  wake_word: "dexter"
  active_hours_start: "09:00"
  active_hours_end: "18:00"
  active_days: [0, 1, 2, 3, 4]  # Mon-Fri; omit for all days
  always_on_after_n_interactions: 3
  always_on_window_seconds: 120
  always_on_timeout_seconds: 300
  fallback_to_always_on_after_failures: 3
  clap_sensitivity: 3.0
  active_window_seconds: 30
  start_active: true
  min_command_words: 2
  wake_words:
    - "hey"
    - "hey dexter"
    - "dexter"

api_keys:
  gemini: ""               # Set GEMINI_API_KEY in .env or environment
  groq: ""                 # Set GROQ_API_KEY in .env or environment

models:
  primary_llm: "gemini-2.0-flash"              # Gemini — fast primary brain
  fallback_llm: "llama-3.3-70b-versatile"      # Groq — lightning fast fallback
  local_llm: "qwen3-coder:480b-cloud"           # Ollama — offline local fallback
  whisper_model: "medium.en"                   # Speech-to-text (runs on RTX GPU)
  tts_voice: "en-GB-RyanNeural"                # Professional British Male Voice (Edge-TTS, free)

defaults:
  city: "Kathmandu"

security:
  require_confirm_power_actions: true
  allowed_apps: []
  allowed_file_roots:
    - "%USERPROFILE%/Documents"
    - "%USERPROFILE%/Desktop"
  tool_timeout_sec: 10

providers:
  gemini_daily_quota_cooldown_hours: 24
  groq_max_tools: 10
  ollama_timeout_seconds: 25
  overall_turn_timeout_seconds: 30

rag:
  intent_catalog_path: "intent_catalog.md"
  intent_top_k: 3
  intent_min_score: 0.72
  personal_roots:
    - "%USERPROFILE%/Documents"
    - "%USERPROFILE%/Desktop"
    - "%USERPROFILE%/Projects"
  chunk_size: 600            # Aggressive: reduced from 800 for faster indexing (~25% fewer chunks)
  chunk_overlap: 100         # Reduced from 120 for speed (still sufficient overlap)
  refresh_seconds: 1800
  embedding_model: "BAAI/bge-base-en-v1.5"   # High-quality BGE embeddings (keep for quality)
  embedding_device: "cuda"                  # auto|cpu|cuda|cuda:0
  index_schema_version: 3    # Bump when collection layout or metadata changes
  max_context_chars: 3000    # Cap context injected into LLM prompts
  batch_size: 256            # Larger batches to reduce embedding round-trips
  max_embedding_threads: 4   # Concurrent batch embedding (0 = serial, >1 = parallel)
  exclude_patterns:
    - ".venv"
    - "__pycache__"
    - ".git"
    - ".pytest_cache"
    - "ipynb_checkpoints"
    - ".DS_Store"
    - ".mypy_cache"
    - "node_modules"
    - "site-packages"
    - "memory_db"
    - "AppData"
    - "Downloads"
    - "Pictures"
    - "Music"
    - "Videos"
    - "Temp"
    - "logs"
    - ".egg-info"
    - "dist"
    - "build"
    - ".tox"
    - "*.pyc"
    - "*.sqlite"
    - "__pycache__"
  minimum_relevance_score: 45.0
  max_results: 5
  excerpt_max_chars: 450
  boost_cap: 30.0
  refresh_only_when_idle: true
  refresh_idle_threshold_seconds: 30
  reranker_enabled: true
  reranker_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  retrieval_candidates: 12
  final_results: 5
  background_batch_size: 64
  background_batch_sleep_seconds: 2.0
  background_embedding_threads: 2
  cpu_throttle_threshold_percent: 65

audio_settings:
  sample_rate: 16000
  chunk_size: 512
  vad_threshold: 0.25
  min_speech_duration_ms: 100
  min_silence_duration_ms: 900
  speech_pad_ms: 400
  max_speech_duration_s: 30

stt:
  model: "medium.en"
  beam_size: 5
  best_of: 5
  temperature: [0.0, 0.2, 0.4]
  patience: 1.0
  log_prob_threshold: -1.0
  no_speech_threshold: 0.6
  condition_on_previous_text: false
  initial_prompt: "Common Windows assistant commands and app names: open, close, start, launch, play, watch, search, find, what is, what's, weather, forecast, time, date, take screenshot, screen capture, read clipboard, copy to clipboard, Chrome, Google Chrome, Edge, Microsoft Edge, Firefox, Brave, Spotify, Discord, Notepad, Calculator, Settings, File Explorer, Visual Studio Code, VS Code, PowerShell, Command Prompt, Windows Terminal, Outlook, Word, Excel, PowerPoint."

history:
  max_tokens: 1800

mcp:
  enabled: true
  server_script: "mcp_server/dexter_mcp_server.py"
  timeout_seconds: 15
  # MCP server starts after Dexter is ready so startup speed is not affected
  start_delay_seconds: 5

proactive:
  enabled: true
  reminder_check_seconds: 60
  system_status_interval_seconds: 900

privacy:
  # When true, Dexter logs full spoken transcripts to logs/dexter.log.
  # Keep false by default to avoid persisting sensitive voice content.
  debug_log_transcripts: false

briefing:
  news_sources:
    - "technology"
    - "world"
    - "science"
  include_weather: true
  include_agenda: true

spotify:
  # Master Keys for OAuth Flow (Provide via .env)
  # SPOTIFY_CLIENT_ID, SPOTIFY_CLIENT_SECRET
  client_id: ""
  client_secret: ""
  redirect_uri: "http://localhost:8888/callback"

media:
  default_platform: "spotify"
